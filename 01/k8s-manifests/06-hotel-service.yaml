apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: hotel-service }
  template:
    metadata:
      labels: { app: hotel-service }
    spec:
      containers:
      - name: hotel-service
        image: hotel-service:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
        envFrom:
        - configMapRef: { name: app-config }
        - secretRef: { name: app-secrets }
        env:
        - name: POSTGRES_DB
          value: "hotels_db"
        - name: JAVA_TOOL_OPTIONS
          value: "-Xmx256m -Xms128m -XX:MaxMetaspaceSize=128m"
        resources:
          limits:
            memory: "512Mi"
          requests:
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-service
spec:
  selector: { app: hotel-service }
  ports:
  - port: 8082
    targetPort: 8082
